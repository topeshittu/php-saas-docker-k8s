name: postifyhq

services:
app:
image: topeshittu/postifyhq:v1
container_name: postifyhq-app
restart: unless-stopped
ports:
- "8080:80"
depends_on:
- db
environment:
DB_HOST: db
DB_PORT: 3306
DB_DATABASE: ${DB_NAME}
DB_USERNAME: ${DB_USER}
DB_PASSWORD: ${DB_PASSWORD}

db:
image: mysql:8.0
container_name: postifyhq-db
restart: unless-stopped
environment:
MYSQL_DATABASE: ${DB_NAME}
MYSQL_USER: ${DB_USER}
MYSQL_PASSWORD: ${DB_PASSWORD}
MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
volumes:
- mysql_data:/var/lib/mysql

volumes:
mysql_data:

